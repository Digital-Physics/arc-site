<script>
const NODES = {
  'n-task': {
    file: 'arc_solver/grid.py → load_tasks()',
    tip: 'Training pairs (each a dict with "input" and "output" numpy arrays) plus a test input. Grids are 2D int arrays, values 0–9. Task object loaded via load_tasks() from the JSON challenge/solution files. Passed directly into solver() for each test pair.',
    flag: null
  },
  'n-stats': {
    file: 'arc_solver/search.py → task_features()  |  arc_solver/infer_params.py → compute_task_stats()',
    tip: 'Single-pass feature extraction: input/output shapes, color sets, sparsity, separator lines, panel count. Cross-pair signals: object sizes, consistent color maps, select-recolor candidates, key-body detection. Called once per task before any search begins.',
    flag: null
  },
  'n-params': {
    file: 'arc_solver/infer_params.py → infer_output_guided_params()',
    tip: 'Detects signals consistent across all training pairs: fg_color, diagonal_dir, shift_rule, key_body_signal, select_recolor_src/dst, marker_color, obj_* flags. Used to guide which steps are added to the beam menu and which parameterized programs are generated. Called in _solve_one_task() for diagnostics too.',
    flag: null
  },
  'n-lookup': {
    file: 'arc_solver/search.py → lookup_solver(), _canonical_bitmask_lookup()',
    tip: 'Tries 6 feature extractors in order: bitmask, obj_count, unique_color, rare_color, fg_color_set, shape. Builds a key→output map from training pairs; fires if consistent and test key is covered. Also runs a canonical bitmask pass (rotation/reflection invariant, requires ≥2 distinct orientations). Cheapest possible solve — runs before any search.',
    flag: null
  },
  'n-pass1': {
    file: 'arc_solver/search.py → solver()  |  arc_solver/dsl.py → base_programs(), parameterized_programs()',
    tip: 'base_programs() is a fixed list of single- and multi-step templates (rotate, reflect, recolor, tile, scale, etc.). parameterized_programs(task) generates task-specific programs using inferred params — e.g. recolor with detected fg_color. All candidates filtered by program_compatible() which prunes structurally impossible programs based on task_features. Catches ~40–50 tasks before beam search.',
    flag: null
  },
  'n-backward': {
    file: 'arc_solver/beam_search.py → build_step_menu() (invertible subset marker)',
    tip: 'The concept: apply invertible steps (rotate, reflect, recolor, shift) to training outputs to generate depth-1 backward targets. Forward nodes that match a backward target can be solved with one more invertible step without additional beam depth. This would allow bidirectional matching at each depth boundary.',
    flag: '⚑ Not currently wired up. The word "backward" does not appear anywhere in search.py. build_step_menu() marks steps as invertible but beam_search() does not appear to use backward_states or run a backward sweep in the uploaded code. Worth implementing or confirming the mechanism is in a different file.'
  },
  'n-menu': {
    file: 'arc_solver/beam_search.py → build_step_menu()',
    tip: 'Assembles ~500 candidate steps per task. Includes: (1) parameter-free steps from the full DSL primitive set, (2) task-guided steps added based on inferred params — diagonal_dir → diagonal steps, select_recolor → recolor steps, key_body_signal → key_body_recolor, (3) invertible steps flagged for potential backward matching. Step count varies by task.',
    flag: null
  },
  'n-beam': {
    file: 'arc_solver/beam_search.py → beam_search()',
    tip: 'Beam width 512, max depth 4, 120 s budget. Each node is a partial program applied to all training inputs. Sort key: (-exact_pairs, pixel_score, best_backward_score). Exits on first exact solve, time budget, or depth exhaustion. Telemetry (exit_reason, depth_stats, best_score, best_program_name, best_program_output) stored as _solver._last_beam_telemetry for post-pass and fallback use.',
    flag: null
  },
  'n-retry': {
    file: 'arc_solver/search.py → solver() — bg retry and near-miss post-pass blocks',
    tip: 'BG retry: if beam found nothing AND any training input has a non-zero majority bg with 0 present, reruns beam with force_bg=0 (10 s budget) — catches sparse-grid tasks where majority-vote inverts fg/bg. Near-miss post-pass: if best_score < 0.1 and no true solve, reconstructs the best partial program from beam telemetry and tries extending it with every menu step (20 s budget).',
    flag: null
  },
  'n-nca': {
    file: 'arc_solver/nca_export.py → run_nca_for_task()  |  export_results.py → _solve_one_task()',
    tip: 'Trains NCAv2/v3 on all training pairs, then runs inference on test input. Config: 2000 epochs, 25 steps (or "incrementing": 1→2→4→8→16→32→64, stops when all pairs exact), hidden=32, lr=1e-3. Color mode resolved via select_color_mode() if "auto". Skip logic: checks nca_manifest.json keyed by full config string — changed hyperparams trigger a full re-run. Runs after the solver so solver timing is unaffected.',
    flag: null
  },
  'n-attn': {
    file: 'arc_solver/nca_arc_v2.py → ObjectAttention  |  arc_solver/nca_export.py → _build_context()',
    tip: 'ObjectAttention computes a context tensor from the input grid, concatenated to NCA input channels (context_ch=16 extra channels per cell). In _build_context(), a fresh ObjectAttention instance is created with random weights and immediately used — it is never trained alongside the NCA.',
    flag: '⚑ Random init at eval time makes this context effectively noise. Either integrate ObjectAttention into the NCA training loop so it learns useful spatial structure, or disable it (context_ch=0). Current form likely adds compute without benefit.'
  },
  'n-cleanup': {
    file: 'arc_solver/nca_export.py — cleanup_nca_output (imported but not called)',
    tip: 'cleanup_nca_output is imported from nca_arc_v2 in nca_export.py. It was intended to post-process the NCA output grid — snapping near-correct cells, removing noise. test_final_cleaned and final_cleaned are set to None in both the training-pair capture loop and the test capture section.',
    flag: '⚑ Disabled in two places with the comment "Cleanup disabled — needs redesign for normal-color mode". The cleaned output path in nca_solved scoring (test.steps[-1] OR test.cleaned == gt) is therefore always relying on the raw final step only. Worth redesigning or removing the dead code path.'
  },
  'n-fallback': {
    file: 'arc_solver/search.py → solver(), _distinct_fallback()',
    tip: 'Guess 1: if no true solve, uses beam_best (highest-scoring partial program from beam telemetry applied to test input) rather than echo_input — an informed wrong answer. Guess 2: _distinct_fallback() tries rotate_180, then reflect_v, then best_partial, then invert_colors — returns the first result visually distinct from guess 1. Program names prefixed "beam_best:" or "fallback_*" to distinguish from real solves.',
    flag: null
  },
  'n-assembly': {
    file: 'export_results.py → _solve_one_task(), run_and_collect()',
    tip: 'Merges solver results and NCA. Deduplication via grids_equal(). NCA is used as guess 2 if the solver produced exactly 1 confirmed solve and nca_solved=True. If both solver and NCA solved, both kept (up to 2 guesses). partial_scores dict accumulates every program scoring >0 on training pairs, used for snapshot analytics: solved_by_step, partial_by_step, depth_dist.',
    flag: null
  },
  'n-output': {
    file: 'export_results.py → run_and_collect() → snapshot JSON',
    tip: 'Up to 2 grid guesses per test input with parallel program names. Snapshot fields per task: guesses[test_n][attempt], steps[test_n][attempt], traces[test_n], partial_scores, beam_telemetry, timing (lookup_s, pass1_s, beam_s, retry_s, postpass_s, total_s), nca_status, nca_solved, nca_best_acc. Snapshot-level: solved_by_step, partial_by_step, depth_dist, guided_signals, nca_summary.',
    flag: null
  }
};

const tip = document.getElementById('tip');
const tipFile = document.getElementById('tip-file');
const tipBody = document.getElementById('tip-body');
const tipFlag = document.getElementById('tip-flag');
const wrap = document.getElementById('wrap');
let mx = 0, my = 0;

document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; positionTip(); });

Object.entries(NODES).forEach(([id, data]) => {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.cursor = 'default';
  el.addEventListener('mouseenter', () => {
    tipFile.textContent = data.file;
    tipBody.textContent = data.tip;
    if (data.flag) {
      tipFlag.textContent = data.flag;
      tipFlag.style.display = 'block';
    } else {
      tipFlag.style.display = 'none';
    }
    tip.classList.add('visible');
    positionTip();
  });
  el.addEventListener('mousemove', positionTip);
  el.addEventListener('mouseleave', () => tip.classList.remove('visible'));
});

function positionTip() {
  const wr = wrap.getBoundingClientRect();
  const tw = 290, th = tip.offsetHeight || 160;
  let l = mx - wr.left + 16;
  let t = my - wr.top - 12;
  if (l + tw > wr.width - 6) l = mx - wr.left - tw - 12;
  if (l < 4) l = 4;
  if (t + th > wr.height - 6) t = my - wr.top - th - 12;
  if (t < 4) t = 4;
  tip.style.left = l + 'px';
  tip.style.top = t + 'px';
}
</script>
