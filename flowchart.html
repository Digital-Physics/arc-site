<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC Solver Pipeline</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --bg2:       #f5f4f0;
    --border:    rgba(0,0,0,0.18);
    --border2:   rgba(0,0,0,0.28);
    --text:      #1a1a18;
    --text2:     #5a5a56;
    --text3:     #8a8a84;

    --purple-fill:   #EEEDFE;
    --purple-stroke: #7F77DD;
    --purple-title:  #3C3489;
    --purple-sub:    #534AB7;

    --blue-fill:   #E6F1FB;
    --blue-stroke: #378ADD;
    --blue-title:  #0C447C;
    --blue-sub:    #185FA5;

    --teal-fill:   #E1F5EE;
    --teal-stroke: #1D9E75;
    --teal-title:  #085041;
    --teal-sub:    #0F6E56;

    --amber-fill:   #FAEEDA;
    --amber-stroke: #BA7517;
    --amber-title:  #633806;
    --amber-sub:    #854F0B;
    --amber-flag:   #854F0B;

    --coral-fill:   #FAECE7;
    --coral-stroke: #D85A30;
    --coral-title:  #712B13;
    --coral-sub:    #993C1D;

    --arr: rgba(0,0,0,0.30);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #1a1a18;
      --bg2:       #252522;
      --border:    rgba(255,255,255,0.14);
      --border2:   rgba(255,255,255,0.24);
      --text:      #e8e6de;
      --text2:     #a8a69e;
      --text3:     #6a6a64;

      --purple-fill:   #3C3489;
      --purple-stroke: #7F77DD;
      --purple-title:  #CECBF6;
      --purple-sub:    #AFA9EC;

      --blue-fill:   #0C447C;
      --blue-stroke: #378ADD;
      --blue-title:  #B5D4F4;
      --blue-sub:    #85B7EB;

      --teal-fill:   #085041;
      --teal-stroke: #1D9E75;
      --teal-title:  #9FE1CB;
      --teal-sub:    #5DCAA5;

      --amber-fill:   #633806;
      --amber-stroke: #BA7517;
      --amber-title:  #FAC775;
      --amber-sub:    #EF9F27;
      --amber-flag:   #FAC775;

      --coral-fill:   #712B13;
      --coral-stroke: #D85A30;
      --coral-title:  #F5C4B3;
      --coral-sub:    #F0997B;

      --arr: rgba(255,255,255,0.28);
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }

  h1 {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 28px;
  }

  .chart { width: 100%; max-width: 740px; position: relative; }

  /* ── tooltip ── */
  .tooltip {
    display: none;
    position: fixed;
    z-index: 999;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    padding: 12px 14px;
    width: 300px;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.18);
    font-size: 12px;
    line-height: 1.55;
  }
  .tooltip.visible { display: block; }
  .tt-file {
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    margin-bottom: 5px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    line-height: 1.4;
    word-break: break-word;
  }
  .tt-body { color: var(--text2); }
  .tt-flag {
    font-size: 11px;
    color: var(--amber-flag);
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--amber-stroke);
    line-height: 1.5;
  }

  /* ── legend ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 0.5px solid var(--border);
    font-size: 11px;
    color: var(--text2);
  }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<h1>ARC Solver — Pipeline</h1>

<div class="chart">
<svg id="svg" width="100%" viewBox="0 0 740 1360" xmlns="http://www.w3.org/2000/svg" style="display:block">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- column labels -->
<text x="100" y="18" text-anchor="middle" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="500" letter-spacing="1.2" fill="var(--text3)">BACKWARD</text>
<text x="370" y="18" text-anchor="middle" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="500" letter-spacing="1.2" fill="var(--text3)">MAIN PIPELINE</text>
<text x="660" y="18" text-anchor="middle" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="500" letter-spacing="1.2" fill="var(--text3)">OUTPUT</text>

<!-- ═══ 1 ARC task ═══ -->
<g class="node" data-id="task">
  <rect x="245" y="30" width="250" height="44" rx="8" fill="var(--bg2)" stroke="var(--border2)" stroke-width="0.5"/>
  <text x="370" y="52" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text)">ARC task</text>
</g>
<line x1="370" y1="74" x2="370" y2="102" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 2 compute_task_stats ═══ -->
<g class="node" data-id="stats">
  <rect x="220" y="102" width="300" height="56" rx="8" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.5"/>
  <text x="370" y="122" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--purple-title)">compute_task_stats</text>
  <text x="370" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--purple-sub)">per-pair + cross-pair features</text>
</g>
<line x1="370" y1="158" x2="370" y2="186" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 3 infer_output_guided_params ═══ -->
<g class="node" data-id="params">
  <rect x="205" y="186" width="330" height="56" rx="8" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.5"/>
  <text x="370" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--purple-title)">infer_output_guided_params</text>
  <text x="370" y="226" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--purple-sub)">diagonal_dir, key_body_signal, fg_color…</text>
</g>
<line x1="370" y1="242" x2="370" y2="270" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 4 lookup_solver ═══ -->
<g class="node" data-id="lookup">
  <rect x="220" y="270" width="300" height="56" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
  <text x="370" y="290" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--teal-title)">lookup_solver</text>
  <text x="370" y="310" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--teal-sub)">bitmask, color, shape, canonical</text>
</g>
<line x1="520" y1="298" x2="600" y2="298" stroke="var(--teal-stroke)" stroke-width="1" marker-end="url(#arr)"/>
<text x="558" y="291" text-anchor="middle" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--teal-sub)">solved</text>
<g class="node" data-id="out-lookup">
  <rect x="600" y="280" width="72" height="36" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.5"/>
  <text x="636" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--teal-title)">output</text>
</g>
<line x1="370" y1="326" x2="370" y2="354" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>
<text x="388" y="345" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text3)">unsolved</text>

<!-- ═══ 5 pass 1 ═══ -->
<g class="node" data-id="pass1">
  <rect x="220" y="354" width="300" height="56" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="370" y="374" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">pass 1</text>
  <text x="370" y="394" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">base + parameterized programs</text>
</g>
<line x1="520" y1="382" x2="600" y2="382" stroke="var(--blue-stroke)" stroke-width="1" marker-end="url(#arr)"/>
<text x="558" y="375" text-anchor="middle" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">solved</text>
<g class="node" data-id="out-pass1">
  <rect x="600" y="364" width="72" height="36" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="636" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">output</text>
</g>
<line x1="370" y1="410" x2="370" y2="438" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 6 backward states (left) + build_step_menu ═══ -->
<g class="node" data-id="backward">
  <rect x="18" y="438" width="162" height="56" rx="8" fill="var(--amber-fill)" stroke="var(--amber-stroke)" stroke-width="0.5"/>
  <text x="99" y="458" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--amber-title)">backward states</text>
  <text x="99" y="478" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--amber-sub)">invertible steps on outputs</text>
</g>
<line x1="180" y1="466" x2="220" y2="466" stroke="var(--amber-stroke)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

<g class="node" data-id="menu">
  <rect x="220" y="438" width="300" height="56" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="370" y="458" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">build_step_menu</text>
  <text x="370" y="478" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">~500 guided + invertible steps</text>
</g>
<line x1="370" y1="494" x2="370" y2="522" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 7 beam search ═══ -->
<g class="node" data-id="beam">
  <rect x="220" y="522" width="300" height="56" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="370" y="542" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">beam search</text>
  <text x="370" y="562" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">width 512 · depth 4 · 120 s</text>
</g>
<line x1="520" y1="550" x2="600" y2="550" stroke="var(--blue-stroke)" stroke-width="1" marker-end="url(#arr)"/>
<text x="558" y="543" text-anchor="middle" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">solved</text>
<g class="node" data-id="out-beam">
  <rect x="600" y="532" width="72" height="36" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="636" y="550" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">output</text>
</g>
<line x1="370" y1="578" x2="370" y2="606" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 8 bg retry + post-pass ═══ -->
<g class="node" data-id="retry">
  <rect x="202" y="606" width="336" height="56" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="370" y="626" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">bg retry + near-miss post-pass</text>
  <text x="370" y="646" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">bg=0 retry + cheap extensions</text>
</g>
<line x1="538" y1="634" x2="600" y2="634" stroke="var(--blue-stroke)" stroke-width="1" marker-end="url(#arr)"/>
<text x="568" y="627" text-anchor="middle" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-sub)">solved</text>
<g class="node" data-id="out-retry">
  <rect x="600" y="616" width="72" height="36" rx="8" fill="var(--blue-fill)" stroke="var(--blue-stroke)" stroke-width="0.5"/>
  <text x="636" y="634" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--blue-title)">output</text>
</g>
<line x1="370" y1="662" x2="370" y2="690" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>
<text x="388" y="681" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text3)">unsolved</text>

<!-- ═══ 8b evolutionary search ═══ -->
<g class="node" data-id="evo">
  <rect x="202" y="690" width="336" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.5"/>
  <text x="370" y="710" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#1b5e20">evolutionary search</text>
  <text x="370" y="730" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#2e7d32">pop=200 · gens≤600 · 60 s · evo_search.py</text>
</g>
<line x1="538" y1="718" x2="600" y2="718" stroke="#2e7d32" stroke-width="1" marker-end="url(#arr)"/>
<text x="568" y="711" text-anchor="middle" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#2e7d32">solved</text>
<g class="node" data-id="out-evo">
  <rect x="600" y="700" width="72" height="36" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="0.5"/>
  <text x="636" y="718" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#1b5e20">output</text>
</g>
<line x1="370" y1="746" x2="370" y2="766" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- fork label -->
<text x="370" y="778" text-anchor="middle" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text3)">run in parallel — same worker</text>
<!-- fork H-bar -->
<line x1="230" y1="788" x2="510" y2="788" stroke="var(--arr)" stroke-width="1"/>
<line x1="230" y1="766" x2="230" y2="788" stroke="var(--arr)" stroke-width="1"/>
<line x1="510" y1="766" x2="510" y2="788" stroke="var(--arr)" stroke-width="1"/>
<line x1="230" y1="788" x2="230" y2="804" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>
<line x1="510" y1="788" x2="510" y2="804" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 9a NCA training ═══ -->
<g class="node" data-id="nca">
  <rect x="50" y="804" width="360" height="56" rx="8" fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="0.5"/>
  <text x="230" y="824" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--coral-title)">NCA training</text>
  <text x="230" y="844" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--coral-sub)">2000 epochs · 25 steps · ~60–120 s/task</text>
</g>
<line x1="230" y1="860" x2="230" y2="972" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- NCA sub-nodes -->
<g class="node" data-id="attn">
  <rect x="50" y="972" width="168" height="56" rx="8" fill="var(--amber-fill)" stroke="var(--amber-stroke)" stroke-width="0.5"/>
  <text x="134" y="992" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--amber-title)">object attention</text>
  <text x="134" y="1012" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--amber-sub)">context_ch=16 · random init</text>
</g>
<g class="node" data-id="cleanup">
  <rect x="242" y="972" width="168" height="56" rx="8" fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="0.5"/>
  <text x="326" y="992" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--coral-title)">output cleanup</text>
  <text x="326" y="1012" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--coral-sub)">palette snap + isolated px</text>
</g>

<!-- ═══ 9b informed fallback ═══ -->
<g class="node" data-id="fallback">
  <rect x="424" y="804" width="196" height="56" rx="8" fill="var(--bg2)" stroke="var(--border2)" stroke-width="0.5"/>
  <text x="522" y="824" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text)">informed fallback</text>
  <text x="522" y="844" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text2)">beam_best partial → guess 1</text>
</g>

<!-- merge lines to guess assembly -->
<line x1="230" y1="1028" x2="230" y2="1088" stroke="var(--arr)" stroke-width="1"/>
<line x1="522" y1="860" x2="522" y2="1088" stroke="var(--arr)" stroke-width="1"/>
<line x1="230" y1="1088" x2="522" y2="1088" stroke="var(--arr)" stroke-width="1"/>
<line x1="370" y1="1088" x2="370" y2="1104" stroke="var(--arr)" stroke-width="1" marker-end="url(#arr)"/>

<!-- ═══ 10 assemble ═══ -->
<g class="node" data-id="assembly">
  <rect x="202" y="1104" width="336" height="56" rx="8" fill="var(--bg2)" stroke="var(--border2)" stroke-width="0.5"/>
  <text x="370" y="1124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text)">assemble()</text>
  <text x="370" y="1144" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="var(--text2)">reads all sidecars → snapshot</text>
</g>

<!-- solver sidecar label (right of assembly) -->
<g class="node" data-id="solver_sidecar">

<div class="tooltip" id="tip">
  <div class="tt-file" id="tt-file"></div>
  <div class="tt-body" id="tt-body"></div>
  <div class="tt-flag" id="tt-flag" style="display:none"></div>
</div>

<script>
const NODES = {
  task: {
    file: 'arc_solver/grid.py → load_tasks()',
    tip: 'Training pairs (each a dict with "input" and "output" numpy arrays) plus a test input. Grids are 2D int arrays, values 0–9. Loaded via load_tasks() from the JSON challenge/solution files. Passed directly into solver() for each test pair.',
    flag: null
  },
  stats: {
    file: 'arc_solver/search.py → task_features()  |  arc_solver/infer_params.py → compute_task_stats()',
    tip: 'Single-pass feature extraction: input/output shapes, color sets, sparsity, separator lines, panel count. Cross-pair signals: object sizes, consistent color maps, select-recolor candidates, key-body detection. Called once per task before any search begins.',
    flag: null
  },
  params: {
    file: 'arc_solver/infer_params.py → infer_output_guided_params()',
    tip: 'Detects signals consistent across all training pairs: fg_color, diagonal_dir, shift_rule, key_body_signal, select_recolor_src/dst, marker_color, obj_* flags. Guides which steps are added to the beam menu and which parameterized programs are generated in pass 1. Also called in _run_solver_for_task() for snapshot diagnostics.',
    flag: null
  },
  lookup: {
    file: 'arc_solver/search.py → lookup_solver(), _canonical_bitmask_lookup()',
    tip: 'Tries 6 feature extractors in order: bitmask, obj_count, unique_color, rare_color, fg_color_set, shape. Builds a key→output map from training pairs; fires if consistent and test key is covered. Also runs a canonical bitmask pass (rotation/reflection invariant, requires ≥2 distinct orientations). Cheapest possible solve — runs before any search.',
    flag: null
  },
  'out-lookup': {
    file: 'arc_solver/search.py → lookup_solver()',
    tip: 'Result of the lookup solver: the output grid from the training pair whose input feature matched the test input. Program name is "lookup:<extractor>→output".',
    flag: null
  },
  pass1: {
    file: 'arc_solver/search.py → solver()  |  arc_solver/dsl.py → base_programs(), parameterized_programs()',
    tip: 'base_programs() is a fixed list of single- and multi-step templates (rotate, reflect, recolor, tile, scale, etc.). parameterized_programs(task) generates task-specific programs using inferred params — e.g. recolor with detected fg_color. All candidates filtered by program_compatible() which prunes structurally impossible programs from task_features. Catches ~40–50 tasks before beam search.',
    flag: null
  },
  'out-pass1': { file: 'arc_solver/search.py → solver()', tip: 'First exact-matching program found in the template candidates, applied to the test input. Traced if capture_trace=True.', flag: null },
  backward: {
    file: 'arc_solver/beam_search.py → build_step_menu() (invertible step markers)',
    tip: 'The concept: apply invertible steps (rotate, reflect, recolor, shift) to training outputs to create depth-1 backward target grids. Forward nodes matching a backward target can be completed with one more invertible step without extra beam depth, enabling bidirectional matching at each depth boundary.',
    flag: '⚑ Not currently wired up. The word "backward" does not appear anywhere in search.py. build_step_menu() marks steps as invertible, but beam_search() does not appear to consume backward_states or run a backward sweep in the current code. Worth implementing.'
  },
  menu: {
    file: 'arc_solver/beam_search.py → build_step_menu()',
    tip: 'Assembles ~500 candidate steps per task. Includes: (1) parameter-free steps from the full DSL primitive set, (2) task-guided steps added from inferred params — diagonal_dir → diagonal steps, select_recolor → recolor steps, key_body_signal → key_body_recolor, (3) invertible steps flagged for potential backward matching. Step count varies by task.',
    flag: null
  },
  beam: {
    file: 'arc_solver/beam_search.py → beam_search()',
    tip: 'Beam width 512, max depth 4, 120 s budget. Each node is a partial program applied to all training inputs. Sort key: (-exact_pairs, pixel_score, best_backward_score). Exits on first exact solve, time budget, or depth exhaustion. Telemetry (exit_reason, depth_stats, best_score, best_program_name, best_program_output) stored as _solver._last_beam_telemetry for post-pass and fallback use.',
    flag: null
  },
  'out-beam': { file: 'arc_solver/beam_search.py → beam_search()', tip: 'First program found by beam search that exactly matches all training outputs, applied to the test input.', flag: null },
  retry: {
    file: 'arc_solver/search.py → solver() — bg retry block + near-miss post-pass block',
    tip: 'BG retry: if beam found nothing AND any training input has a non-zero majority bg with 0 present, reruns beam with force_bg=0 (10 s budget) — catches sparse-grid tasks where majority-vote inverts fg/bg. Near-miss post-pass: if best_score < 0.1 and no true solve, reconstructs the best partial program from beam telemetry and tries extending it with every menu step (20 s budget).',
    flag: null
  },
  evo: {
    file: 'arc_solver/evo_search.py → evolutionary_search()  |  primitive_discovery_loop.py',
    tip: 'Evolutionary search over DSL programs. Population of 200, up to 600 generations, 60s budget. Seeds population from base_programs() + parameterized_programs(). Mutation: swap/insert/delete one step. Crossover: one-point splice. Fitness: exact training pair matches / total pairs. Telemetry (best_fitness, exit_reason, gens_run, best_prog) written to _evo.json sidecar. If evo fails, primitive_discovery_loop.py calls Claude to write a new primitive, verifies it, integrates it into the DSL, then re-runs evo.',
    flag: null
  },
  'out-evo': {
    file: 'arc_solver/evo_search.py → evolutionary_search()',
    tip: 'Program found by evolutionary search that exactly matches all training outputs, applied to the test input. Written to <id>_evo.json sidecar.',
    flag: null
  },
  'out-retry': { file: 'arc_solver/search.py → solver()', tip: 'Output from either the bg=0 retry beam or the near-miss post-pass extension, whichever finds an exact match first.', flag: null },
  nca: {
    file: 'arc_solver/nca_export.py → run_nca_for_task()  |  export_results.py → _run_nca_for_task()',
    tip: 'Trains NCAv2/v3 on all training pairs, then runs inference on test input. Config: 2000 epochs, 32 steps, hidden=32, lr=1e-3. Color mode resolved via select_color_mode() if "auto". Skips if <id>_nca.json exists (use --nca-force to overwrite). --start-from N skips tasks before index N or task ID — counter shows true position in full list. Manifest removed: skip logic is file-existence only.',
    flag: null
  },
  attn: {
    file: 'arc_solver/nca_arc_v2.py → ObjectAttention  |  arc_solver/nca_export.py → _build_context()',
    tip: 'ObjectAttention computes a context tensor from the input grid (context_ch=16 extra channels per cell), concatenated to NCA input. In _build_context(), a fresh ObjectAttention instance is created with random weights and immediately used at inference — it is never trained alongside the NCA model.',
    flag: '⚑ Random init at eval time makes this context effectively noise. Either integrate ObjectAttention into the NCA training loop so it learns useful spatial structure, or disable it entirely (context_ch=0). Current form adds compute with no clear benefit.'
  },
  cleanup: {
    file: 'arc_solver/nca_export.py → _cleanup_output()',
    tip: 'Two-pass post-processing in ARC color space (applied after any canonical→ARC inversion, so color-mode-agnostic). Pass 1 — palette snap: restricts cell values to colors appearing in any training output; stray values snapped to nearest palette color by integer distance. Pass 2 — isolated pixel removal: single-pixel islands surrounded by a uniform neighbour are replaced with that colour. Fully vectorised via numpy. Result stored as test.cleaned and scored separately from the raw final step.',
    flag: null
  },
  fallback: {
    file: 'arc_solver/search.py → solver(), _distinct_fallback()',
    tip: 'Guess 1: if no true solve, uses beam_best (highest-scoring partial program from beam telemetry applied to test input) rather than echo_input — an informed wrong answer is better than an uninformed one. Guess 2: _distinct_fallback() tries rotate_180, then reflect_v, then best_partial, then invert_colors — returns the first result visually distinct from guess 1.',
    flag: null
  },
  solver_sidecar: {
    file: 'export_results.py → _run_solver_for_task() → write_solver_sidecar()',
    tip: 'Writes <id>_solver.json after each task completes. Contains: guesses, steps, traces, partial_scores, beam_telemetry, timing, guided_params, gt_outputs, wall_s. Skipped if file exists (use --solver-force to overwrite). Read by assemble() to produce the snapshot without re-running the solver. Parallel to <id>_nca.json — same skip/force/start-from pattern.',
    flag: null
  },
  assembly: {
    file: 'export_results.py → assemble()',
    tip: 'Pure read + aggregate — no compute. Reads all <id>_solver.json + <id>_nca.json for all 1000 tasks. Scores each (solver exact match OR NCA raw/cleaned exact). Computes: solved_by_step, partial_by_step, depth_dist, guided_signals, nca_summary (with train_acc_dist, test_acc_dist, color_mode_counts, cleanup_only, nca_only_solved). Called automatically at end of --solver, --nca-only, and --full runs. Always uses full task list regardless of --start-from.',
    flag: null
  },
  output: {
    file: 'export_results.py → assemble() → YYYY-MM-DD.json + history.json',
    tip: 'Snapshot per task: guesses[test_n][attempt], steps, traces, program, partial_scores, beam, nca (status, any_exact, raw_solved, cleaned_solved, best_acc, best_loss, test_acc, color_mode). Snapshot-level: score, solved_by_step, partial_by_step, depth_dist, guided_signals, nca_summary (with train_acc_dist, test_acc_dist, color_mode_counts). history.json appended for the progress chart.',
    flag: null
  }
};

const tip    = document.getElementById('tip');
const ttFile = document.getElementById('tt-file');
const ttBody = document.getElementById('tt-body');
const ttFlag = document.getElementById('tt-flag');
let mx = 0, my = 0;

document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; if (tip.classList.contains('visible')) pos(); });

document.querySelectorAll('.node[data-id]').forEach(el => {
  const id   = el.dataset.id;
  const data = NODES[id];
  if (!data) return;
  el.style.cursor = 'default';
  el.addEventListener('mouseenter', () => {
    ttFile.textContent = data.file;
    ttBody.textContent = data.tip;
    if (data.flag) { ttFlag.textContent = data.flag; ttFlag.style.display = 'block'; }
    else ttFlag.style.display = 'none';
    tip.classList.add('visible');
    pos();
  });
  el.addEventListener('mousemove', pos);
  el.addEventListener('mouseleave', () => tip.classList.remove('visible'));
});

function pos() {
  const tw = 300, th = tip.offsetHeight || 160;
  let l = mx + 16, t = my - 12;
  if (l + tw > window.innerWidth - 8)  l = mx - tw - 12;
  if (l < 6) l = 6;
  if (t + th > window.innerHeight - 8) t = my - th - 12;
  if (t < 6) t = 6;
  tip.style.left = l + 'px';
  tip.style.top  = t + 'px';
}
</script>
